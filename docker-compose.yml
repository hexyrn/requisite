version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexyrn
      POSTGRES_PASSWORD: hexyrn_dev_password
      POSTGRES_DB: hexyrn_core
    ports:
      - '5432:5432'
    volumes:
      - hexyrn_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hexyrn -d hexyrn_core']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexyrn
      POSTGRES_PASSWORD: hexyrn_test_password
      POSTGRES_DB: hexyrn_core_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hexyrn -d hexyrn_core_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hexyrn_pg_data:
